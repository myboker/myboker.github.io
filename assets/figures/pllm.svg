<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 516" width="100%" role="img" aria-label="pLLM Architecture Overview: Declarative PyTorch Workload, CPU Pre-Flight Planner and Verifier, and Programmable Hook Surfaces in Unmodified vLLM">
  <style>
    .title { font: 800 15.8px "DM Sans", -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif; fill: #111111; }
    .hdr { font: 700 13.5px "DM Sans", -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif; fill: #ffffff; letter-spacing: 0.01em; }
    .label { font: 700 12.8px "DM Sans", -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif; fill: #111111; }
    .sub { font: 400 11.4px "DM Sans", -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif; fill: #3f3f46; }
    .muted { font: 500 11px "DM Sans", -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif; fill: #52525b; }
    .mono { font: 600 10.8px "JetBrains Mono", "SF Mono", Menlo, Consolas, monospace; fill: #111111; }
    .badge { font: 700 10.2px "JetBrains Mono", "SF Mono", Menlo, monospace; letter-spacing: 0.03em; }
  </style>
  <defs>
    <marker id="arr-ink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#111111"/>
    </marker>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#0047ab"/>
    </marker>
  </defs>

  <!-- Outer Frame -->
  <rect x="4" y="4" width="972" height="508" rx="8" fill="#ffffff" stroke="#111111" stroke-width="2"/>

  <!-- Top Header Bar -->
  <text x="24" y="33" class="title">pLLM (Programmable LLM) — Stop Forking vLLM to Test a New Idea</text>
  <text x="956" y="33" text-anchor="end" class="muted">Zero engine edits · &lt; 2s CPU safety check · Compiled into CUDA Graphs</text>
  <line x1="22" y1="46" x2="958" y2="46" stroke="#e4e4e7" stroke-width="1.5"/>

  <!-- ==================== COLUMN 1: DECLARATIVE WORKLOAD ==================== -->
  <rect x="25" y="62" width="246" height="430" rx="6" fill="#111111"/>
  <rect x="22" y="59" width="246" height="430" rx="6" fill="#fefce8" stroke="#111111" stroke-width="1.75"/>
  <rect x="22" y="59" width="246" height="38" rx="6" fill="#111111"/>
  <rect x="22" y="85" width="246" height="12" fill="#111111"/>
  <text x="145" y="83" text-anchor="middle" class="hdr">1. Declarative pllm.Workload</text>

  <!-- 1A: READ -->
  <rect x="34" y="109" width="222" height="102" rx="5" fill="#ffffff" stroke="#111111" stroke-width="1.3"/>
  <rect x="44" y="118" width="52" height="19" rx="4" fill="#0047ab"/>
  <text x="70" y="131" text-anchor="middle" class="badge" fill="#ffffff">READ</text>
  <text x="104" y="131" class="muted">Model internals</text>
  <text x="44" y="153" class="mono">hidden · residual</text>
  <text x="44" y="173" class="mono">layer_logits · attention</text>
  <text x="44" y="193" class="mono">input_tokens · sampled</text>

  <!-- 1B: STATE (Optional) -->
  <rect x="34" y="221" width="222" height="94" rx="5" fill="#ffffff" stroke="#111111" stroke-width="1.3"/>
  <rect x="44" y="230" width="58" height="19" rx="4" fill="#d99b26"/>
  <text x="73" y="243" text-anchor="middle" class="badge" fill="#111111">STATE</text>
  <text x="110" y="243" class="muted">Stateless or scoped</text>
  <text x="44" y="265" class="mono">RequestState · InstanceState</text>
  <text x="44" y="285" class="mono">PositionState · Pretrained</text>
  <text x="44" y="303" class="sub">HBM or pinned host DRAM</text>

  <!-- 1C: INTERVENE / ACT -->
  <rect x="34" y="325" width="222" height="152" rx="5" fill="#ffffff" stroke="#111111" stroke-width="1.3"/>
  <rect x="44" y="334" width="86" height="19" rx="4" fill="#e62b2b"/>
  <text x="87" y="347" text-anchor="middle" class="badge" fill="#ffffff">INTERVENE</text>
  <text x="138" y="347" class="muted">Hook surfaces</text>
  <text x="44" y="370" class="sub">• <tspan class="mono">@export</tspan> probes &amp; telemetry</text>
  <text x="44" y="391" class="sub">• <tspan class="mono">Patch / Adapter</tspan> overlays</text>
  <text x="44" y="412" class="sub">• <tspan class="mono">@custom_attention / forward</tspan></text>
  <text x="44" y="433" class="sub">• <tspan class="mono">@add_logits / guide_sampling</tspan></text>
  <text x="44" y="454" class="sub">• <tspan class="mono">@write / @train</tspan> state updates</text>

  <!-- Arrow Col 1 -> Col 2 -->
  <line x1="268" y1="274" x2="288" y2="274" stroke="#111111" stroke-width="2" marker-end="url(#arr-ink)"/>

  <!-- ==================== COLUMN 2: CPU PRE-FLIGHT ==================== -->
  <rect x="295" y="62" width="206" height="430" rx="6" fill="#111111"/>
  <rect x="292" y="59" width="206" height="430" rx="6" fill="#f5f5f4" stroke="#111111" stroke-width="1.75"/>
  <rect x="292" y="59" width="206" height="38" rx="6" fill="#0047ab"/>
  <rect x="292" y="85" width="206" height="12" fill="#0047ab"/>
  <text x="395" y="83" text-anchor="middle" class="hdr">2. CPU Planner &amp; Verifier</text>

  <rect x="315" y="109" width="160" height="24" rx="12" fill="#eef4ff" stroke="#0047ab" stroke-width="1.25"/>
  <text x="395" y="125" text-anchor="middle" class="badge" fill="#0047ab">PRE-FLIGHT · 0 GPU</text>

  <!-- explain card -->
  <rect x="304" y="143" width="182" height="150" rx="5" fill="#ffffff" stroke="#111111" stroke-width="1.3"/>
  <rect x="314" y="153" width="110" height="20" rx="4" fill="#111111"/>
  <text x="369" y="167" text-anchor="middle" class="badge" fill="#ffffff">pllm.explain</text>
  <text x="314" y="192" class="label">Execution Plan &amp; Cost</text>
  <text x="314" y="214" class="sub">• Step-anchor placement</text>
  <text x="314" y="235" class="sub">• CUDA Graph &amp; op fusion</text>
  <text x="314" y="256" class="sub">• Exact VRAM &amp; page cap</text>
  <text x="314" y="277" class="sub">• Zero host-sync audit</text>

  <!-- check card -->
  <rect x="304" y="305" width="182" height="172" rx="5" fill="#ffffff" stroke="#111111" stroke-width="1.3"/>
  <rect x="314" y="315" width="118" height="20" rx="4" fill="#059669"/>
  <text x="373" y="329" text-anchor="middle" class="badge" fill="#ffffff">testing.check</text>
  <text x="314" y="354" class="label">Multi-Tenant Contracts</text>
  <text x="314" y="376" class="sub">• Row-order invariance</text>
  <text x="314" y="397" class="sub">• Cross-tenant isolation</text>
  <text x="314" y="418" class="sub">• Chunked prefill parity</text>
  <text x="314" y="439" class="sub">• KV preemption safety</text>
  <text x="314" y="460" class="sub">• Neutral no-op equivalence</text>

  <!-- Arrow Col 2 -> Col 3 -->
  <line x1="498" y1="274" x2="518" y2="274" stroke="#111111" stroke-width="2" marker-end="url(#arr-ink)"/>

  <!-- ==================== COLUMN 3: UNMODIFIED VLLM RUNTIME ==================== -->
  <rect x="525" y="62" width="433" height="430" rx="6" fill="#111111"/>
  <rect x="522" y="59" width="433" height="430" rx="6" fill="#ffffff" stroke="#111111" stroke-width="1.75"/>
  <rect x="522" y="59" width="433" height="38" rx="6" fill="#111111"/>
  <rect x="522" y="85" width="433" height="12" fill="#111111"/>
  <text x="738" y="83" text-anchor="middle" class="hdr">3. Unmodified vLLM Engine (0.27–0.34)</text>

  <!-- Serving Entry Points Strip -->
  <rect x="536" y="107" width="405" height="34" rx="5" fill="#f5f5f4" stroke="#111111" stroke-width="1.2"/>
  <text x="548" y="128" class="sub"><tspan class="badge" fill="#111111">ENTRY:</tspan>  <tspan class="mono">make_llm</tspan> · <tspan class="mono">make_async_llm</tspan> · <tspan class="mono">pllm serve</tspan> <tspan class="muted">(SSE)</tspan></text>

  <!-- Programmable Inference Pipeline Box -->
  <rect x="536" y="151" width="405" height="188" rx="6" fill="#eef4ff" stroke="#0047ab" stroke-width="1.5"/>
  <rect x="548" y="161" width="268" height="20" rx="4" fill="#0047ab"/>
  <text x="682" y="175" text-anchor="middle" class="badge" fill="#ffffff">PROGRAMMABLE HOOK SURFACES (IN-GRAPH)</text>
  <text x="929" y="175" text-anchor="end" class="muted">Packed [T, H]</text>

  <!-- Stage A: Input & Lookup -->
  <rect x="548" y="189" width="122" height="110" rx="5" fill="#ffffff" stroke="#111111" stroke-width="1.3"/>
  <rect x="556" y="197" width="106" height="18" rx="3" fill="#fefce8" stroke="#111111" stroke-width="1"/>
  <text x="609" y="210" text-anchor="middle" class="badge">INPUT &amp; TABLES</text>
  <text x="609" y="233" text-anchor="middle" class="sub">Token history</text>
  <text x="609" y="252" text-anchor="middle" class="sub">N-gram / Engram</text>
  <text x="609" y="271" text-anchor="middle" class="sub">memory lookup</text>
  <text x="609" y="289" text-anchor="middle" class="muted">HBM / host DRAM</text>

  <line x1="670" y1="244" x2="682" y2="244" stroke="#111111" stroke-width="1.7" marker-end="url(#arr-ink)"/>

  <!-- Stage B: Decoder Layers & Paged KV -->
  <rect x="685" y="189" width="126" height="110" rx="5" fill="#ffffff" stroke="#111111" stroke-width="1.3"/>
  <rect x="693" y="197" width="110" height="18" rx="3" fill="#fefce8" stroke="#111111" stroke-width="1"/>
  <text x="748" y="210" text-anchor="middle" class="badge">LAYERS &amp; KV</text>
  <text x="748" y="233" text-anchor="middle" class="sub">Steering &amp; LoRA</text>
  <text x="748" y="252" text-anchor="middle" class="sub">Residual / Triton</text>
  <text x="748" y="271" text-anchor="middle" class="sub">Sparse / MLA KV</text>
  <text x="748" y="289" text-anchor="middle" class="sub">Looped / early exit</text>

  <line x1="811" y1="244" x2="823" y2="244" stroke="#111111" stroke-width="1.7" marker-end="url(#arr-ink)"/>

  <!-- Stage C: Logits, Sampler & Export -->
  <rect x="826" y="189" width="103" height="110" rx="5" fill="#ffffff" stroke="#111111" stroke-width="1.3"/>
  <rect x="833" y="197" width="89" height="18" rx="3" fill="#fefce8" stroke="#111111" stroke-width="1"/>
  <text x="877.5" y="210" text-anchor="middle" class="badge">LOGITS &amp; I/O</text>
  <text x="877.5" y="233" text-anchor="middle" class="sub">DoLa contrast</text>
  <text x="877.5" y="252" text-anchor="middle" class="sub">Guided sampler</text>
  <text x="877.5" y="271" text-anchor="middle" class="sub">Linear probes</text>
  <text x="877.5" y="289" text-anchor="middle" class="sub">&amp; SAE export</text>

  <text x="548" y="324" class="sub">15 decoder families · GPTQ / AWQ / FP8 · Tensor Parallelism</text>

  <!-- Bottom Box: Managed Runtime Services -->
  <rect x="536" y="359" width="405" height="118" rx="6" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
  <rect x="548" y="368" width="264" height="20" rx="4" fill="#059669"/>
  <text x="680" y="382" text-anchor="middle" class="badge" fill="#ffffff">MANAGED STATE &amp; ADAPTIVE SCHEDULING</text>

  <!-- Sub-box 1: Multi-Tenant Paged State -->
  <rect x="548" y="395" width="186" height="70" rx="5" fill="#ffffff" stroke="#111111" stroke-width="1.3"/>
  <text x="641" y="416" text-anchor="middle" class="label">Paged Multi-Tenant State</text>
  <text x="641" y="436" text-anchor="middle" class="sub">Request / session versions</text>
  <text x="641" y="454" text-anchor="middle" class="muted">Live import · Preempt rewind</text>

  <!-- Sub-box 2: Adaptive Execution & Loops -->
  <rect x="743" y="395" width="186" height="70" rx="5" fill="#ffffff" stroke="#111111" stroke-width="1.3"/>
  <text x="836" y="416" text-anchor="middle" class="label">Adaptive Execution</text>
  <text x="836" y="436" text-anchor="middle" class="sub">Inline graph fusion default</text>
  <text x="836" y="454" text-anchor="middle" class="muted">Async overlap · Host loops</text>

  <!-- Connector between Pipeline & Runtime Services -->
  <line x1="641" y1="359" x2="641" y2="341" stroke="#0047ab" stroke-width="1.7" stroke-dasharray="4 3" marker-end="url(#arr-blue)"/>
  <line x1="836" y1="339" x2="836" y2="357" stroke="#0047ab" stroke-width="1.7" stroke-dasharray="4 3" marker-end="url(#arr-blue)"/>
</svg>
